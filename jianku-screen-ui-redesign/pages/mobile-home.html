/* Source: structured-spec */
/* Brand profile: google / dashboard / clean / analytical / modern */
/* Theme mode: light-dark */
/* Alias layer: enabled */

/* Light mode source tokens */
:root {
  /* Core surface colors */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* Semantic action colors */
  --primary: #4285f4;
  --primary-foreground: #ffffff;
  --secondary: #dbeafe;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #dbeafe;
  --accent-foreground: #003e8f;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #ebebeb;
  --input: #e2e3e4;
  --ring: #4285f4;

  /* Data visualization */
  --chart-1: #4285f4;
  --chart-2: #ea4335;
  --chart-3: #fbbc05;
  --chart-4: #0043ad;
  --chart-5: #34a853;

  /* Sidebar */
  --sidebar: #f0f6ff;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #4285f4;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #dbeafe;
  --sidebar-accent-foreground: #003e8f;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #4285f4;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #0e1115;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-sm: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow-md: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 2px 4px -1px rgba(14, 17, 21, 0);
  --shadow-lg: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 4px 6px -1px rgba(14, 17, 21, 0);
  --shadow-xl: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 8px 10px -1px rgba(14, 17, 21, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(14, 17, 21, 0);

  /* Rhythm */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
  /* Patched radius aliases for head-contract compatibility */
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);

}

/* Dark mode source tokens */

  --shadow-2xl: 0 3px 0px 0px rgba(0, 0, 0, 0);
}

  /* Radius aliases */

}

    <style id="critical-layout">
      :root { --mobile-shell-width: 430px; }
      .mobile-shell {
        position: relative;
        width: 100%;
        max-width: var(--mobile-shell-width);
        min-height: 100vh;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        background: var(--background);
        color: var(--foreground);
      }
      .mobile-scrollable {
        flex: 1 1 auto;
        padding: calc(var(--spacing) * 5) calc(var(--spacing) * 5) calc(56px + 88px);
      }
      .app-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: calc(var(--spacing) * 4);
        padding: calc(var(--spacing) * 4) calc(var(--spacing) * 5) calc(var(--spacing) * 3);
      }
      .bottom-nav {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        max-width: var(--mobile-shell-width);
        height: 56px;
        background: var(--card);
        border-top: 1px solid var(--border);
        display: flex;
        align-items: stretch;
        z-index: 50;
      }
      .bottom-nav a {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 11px;
        line-height: 1;
        color: var(--muted-foreground);
        text-decoration: none;
      }
      .bottom-nav a[aria-current="page"] {
        color: var(--primary);
      }
      .fab {
        position: fixed;
        bottom: calc(56px + 16px);
        right: max(calc(var(--spacing) * 6), calc((100vw - var(--mobile-shell-width)) / 2 + calc(var(--spacing) * 6)));
        z-index: 60;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--primary);
        color: var(--primary-foreground);
        border: none;
        cursor: pointer;
      }
      .fab:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      .recording-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: calc(var(--spacing) * 3);
      }
      .recording-item {
        display: flex;
        align-items: center;
        gap: calc(var(--spacing) * 4);
        padding: calc(var(--spacing) * 3);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--card);
      }
      .recording-thumb {
        flex: 0 0 auto;
        width: 80px;
        height: 56px;
        border-radius: var(--radius);
        background: linear-gradient(135deg, var(--muted) 0%, var(--accent) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted-foreground);
      }
      .recording-meta {
        flex: 1 1 auto;
        min-width: 0;
      }
      .recording-title {
        margin: 0 0 4px;
        font-size: 14px;
        font-weight: 600;
        line-height: 1.3;
        color: var(--foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .recording-sub {
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--muted-foreground);
      }
      .status-badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
        line-height: 1.4;
      }
      .search-input {
        width: 100%;
        height: 40px;
        padding: 0 calc(var(--spacing) * 4);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--muted);
        color: var(--foreground);
        font: inherit;
        font-size: 14px;
      }
      .search-input::placeholder {
        color: var(--muted-foreground);
      }
      .search-input:focus {
        outline: none;
        border-color: var(--ring);
      }
      .icon {
        display: inline-flex;
        width: 20px;
        height: 20px;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
      .icon-sm { width: 16px; height: 16px; }
      .icon-lg { width: 24px; height: 24px; }
      .segmented {
        display: flex;
        align-items: center;
        gap: calc(var(--spacing) * 2);
        overflow-x: auto;
        padding-bottom: calc(var(--spacing) * 2);
        scrollbar-width: none;
      }
      .segmented::-webkit-scrollbar { display: none; }
      .segment {
        flex: 0 0 auto;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--card);
        color: var(--foreground);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .segment[aria-pressed="true"] {
        background: var(--primary);
        color: var(--primary-foreground);
        border-color: var(--primary);
      }
      .segment:focus-visible {
        outline: 2px solid var(--ring);
        outline-offset: 2px;
      }
      @media (max-width: 430px) {
        .fab { right: calc(var(--spacing) * 6); }
      }
    </style>
    <main class="mobile-shell">

            <button type="button" class="segment" aria-pressed="false">最近</button>
            <button type="button" class="segment" aria-pressed="false">待导出</button>
            <button type="button" class="segment" aria-pressed="false">已完成</button>

        </section>

        <section aria-label="最近录制" class="mt-5">

          </div>
          <ul class="recording-list" role="list">

              </div>

            </li>
            <li class="recording-item">

              </div>
              <div class="recording-meta">

            </li>
            <li class="recording-item">
              <div class="recording-thumb" aria-label="设计评审缩略图">
                <span class="icon icon-lg" style="-webkit-mask-image: url(../assets/icons/google/circle-play.svg); mask-image: url(../assets/icons/google/circle-play.svg);"></span>
              </div>
              <div class="recording-meta">
                <p class="recording-title">设计评审会议纪要</p>
                <p class="recording-sub">2026-10-12 · 08:45</p>
              </div>
              <span class="status-badge bg-secondary text-secondary-foreground">未导出</span>
            </li>
            <li class="recording-item">
              <div class="recording-thumb" aria-label="实时演示缩略图">
                <span class="icon icon-lg" style="-webkit-mask-image: url(../assets/icons/google/circle-play.svg); mask-image: url(../assets/icons/google/circle-play.svg);"></span>
              </div>
              <div class="recording-meta">
                <p class="recording-title">实时演示 - 焦点缩放</p>
                <p class="recording-sub">2026-10-11 · 15:20</p>
              </div>
              <span class="status-badge bg-muted text-muted-foreground">已导出</span>
            </li>
          </ul>
        </section>
      </div>

      <button type="button" class="fab" aria-label="新建录制">
        <span class="icon icon-lg" style="-webkit-mask-image: url(../assets/icons/google/circle-plus.svg); mask-image: url(../assets/icons/google/circle-plus.svg);"></span>
      </button>

      </nav>
    </main>

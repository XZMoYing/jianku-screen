    <style id="theme-vars">
/* Source: structured-spec */
/* Brand profile: google / dashboard / clean / analytical / modern */
/* Theme mode: light-dark */
/* Alias layer: enabled */

/* Light mode source tokens */
:root {
  /* Core surface colors */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* Semantic action colors */
  --primary: #4285f4;
  --primary-foreground: #ffffff;
  --secondary: #dbeafe;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #dbeafe;
  --accent-foreground: #003e8f;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #ebebeb;
  --input: #e2e3e4;
  --ring: #4285f4;

  /* Data visualization */
  --chart-1: #4285f4;
  --chart-2: #ea4335;
  --chart-3: #fbbc05;
  --chart-4: #0043ad;
  --chart-5: #34a853;

  /* Sidebar */
  --sidebar: #f0f6ff;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #4285f4;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #dbeafe;
  --sidebar-accent-foreground: #003e8f;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #4285f4;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #0e1115;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-sm: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow-md: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 2px 4px -1px rgba(14, 17, 21, 0);
  --shadow-lg: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 4px 6px -1px rgba(14, 17, 21, 0);
  --shadow-xl: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 8px 10px -1px rgba(14, 17, 21, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(14, 17, 21, 0);

  /* Rhythm */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
  /* Patched radius aliases for head-contract compatibility */
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);

}

/* Dark mode source tokens */
.dark {
  /* Core surface colors */
  --background: #161616;
  --foreground: #eff1f4;
  --card: #1d1d1c;
  --card-foreground: #eff1f4;
  --popover: #2e2e2e;
  --popover-foreground: #e5e5e5;

  /* Semantic action colors */
  --primary: #fc2c50;
  --primary-foreground: #ffffff;
  --secondary: #383838;
  --secondary-foreground: #e5e5e5;
  --muted: #383838;
  --muted-foreground: #949494;
  --accent: #4a2026;
  --accent-foreground: #fc2c50;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #1d1d1c;
  --input: #000000;
  --ring: #ffffff;

  /* Data visualization */
  --chart-1: #2dccd3;
  --chart-2: #f1204a;
  --chart-3: #edbbe8;
  --chart-4: #fbeb35;
  --chart-5: #baf6f0;

  /* Sidebar */
  --sidebar: #171717;
  --sidebar-foreground: #e5e5e5;
  --sidebar-primary: #0065fd;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #00266b;
  --sidebar-accent-foreground: #bfdbfe;
  --sidebar-border: #404040;
  --sidebar-ring: #00266b;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(0, 0, 0, 0);
}

/* Alias layer */
@theme inline {
  /* Color aliases */
  --google-color-background: var(--background);
  --google-color-foreground: var(--foreground);
  --google-color-card: var(--card);
  --google-color-card-foreground: var(--card-foreground);
  --google-color-popover: var(--popover);
  --google-color-popover-foreground: var(--popover-foreground);
  --google-color-primary: var(--primary);
  --google-color-primary-foreground: var(--primary-foreground);
  --google-color-secondary: var(--secondary);
  --google-color-secondary-foreground: var(--secondary-foreground);
  --google-color-muted: var(--muted);
  --google-color-muted-foreground: var(--muted-foreground);
  --google-color-accent: var(--accent);
  --google-color-accent-foreground: var(--accent-foreground);
  --google-color-destructive: var(--destructive);
  --google-color-destructive-foreground: var(--destructive-foreground);
  --google-color-border: var(--border);
  --google-color-input: var(--input);
  --google-color-ring: var(--ring);
  --google-color-chart-1: var(--chart-1);
  --google-color-chart-2: var(--chart-2);
  --google-color-chart-3: var(--chart-3);
  --google-color-chart-4: var(--chart-4);
  --google-color-chart-5: var(--chart-5);
  --google-color-sidebar: var(--sidebar);
  --google-color-sidebar-foreground: var(--sidebar-foreground);
  --google-color-sidebar-primary: var(--sidebar-primary);
  --google-color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --google-color-sidebar-accent: var(--sidebar-accent);
  --google-color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --google-color-sidebar-border: var(--sidebar-border);
  --google-color-sidebar-ring: var(--sidebar-ring);

  /* Typography aliases */
  --google-font-sans: var(--font-sans);
  --google-font-serif: var(--font-serif);
  --google-font-mono: var(--font-mono);

  /* Radius aliases */
  --google-radius: var(--radius);
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);
  --google-radius-xl: calc(var(--radius) + 4px);

  /* Shadow aliases */
  --google-shadow-x: var(--shadow-x);
  --google-shadow-y: var(--shadow-y);
  --google-shadow-blur: var(--shadow-blur);
  --google-shadow-spread: var(--shadow-spread);
  --google-shadow-opacity: var(--shadow-opacity);
  --google-shadow-color: var(--shadow-color);
  --google-shadow-2xs: var(--shadow-2xs);
  --google-shadow-xs: var(--shadow-xs);
  --google-shadow-sm: var(--shadow-sm);
  --google-shadow: var(--shadow);
  --google-shadow-md: var(--shadow-md);
  --google-shadow-lg: var(--shadow-lg);
  --google-shadow-xl: var(--shadow-xl);
  --google-shadow-2xl: var(--shadow-2xl);

  /* Rhythm aliases */
  --google-tracking-normal: var(--tracking-normal);
  --google-spacing: var(--spacing);
}

    </style>

    <main class="editor-shell">
      <!-- Top toolbar -->
      <header class="editor-topbar">
        <div class="flex items-center gap-3">
          <span class="flex items-center justify-center w-8 h-8 rounded-md bg-primary text-primary-foreground font-semibold text-sm">JS</span>

            <span class="text-sm font-semibold leading-tight">Jianku Screen Next</span>

          <button type="button" class="btn btn-ghost btn-sm">素材库</button>

          <div class="mt-auto flex flex-col items-center gap-1">
            <button type="button" class="rail-item" aria-label="帮助">
              <span data-icon class="w-5 h-5" style="-webkit-mask-image:url(../assets/icons/google/circle-question-mark.svg);mask-image:url(../assets/icons/google/circle-question-mark.svg)"></span>
            </button>
          </div>
        </nav>

        <!-- Stage + properties -->
        <section class="editor-stage" aria-label="编辑工作区">
          <!-- Canvas -->
          <div class="canvas-wrap">
            <div class="canvas">
              <article class="relative w-[720px] max-w-[92%] aspect-video rounded-lg border border-border bg-card shadow-sm overflow-hidden">
                <div class="absolute inset-0 flex items-center justify-center bg-gradient-to-br from-muted to-background">
                  <div class="text-center">
                    <div class="mx-auto mb-3 flex items-center justify-center w-16 h-16 rounded-full bg-primary text-primary-foreground">
                      <span data-icon class="w-8 h-8" style="-webkit-mask-image:url(../assets/icons/google/circle-play.svg);mask-image:url(../assets/icons/google/circle-play.svg)"></span>
                    </div>
                    <p class="text-sm font-medium text-foreground">预览画布</p>
                    <p class="text-xs text-muted-foreground mt-1">1920 × 1080 · 30 fps</p>
                  </div>
                </div>
                <div class="absolute top-3 left-3 px-2 py-1 rounded bg-background/90 border border-border text-xs font-mono text-muted-foreground">00:00:05:12</div>
              </article>
            </div>

            <!-- Playback bar overlay -->
            <div class="flex items-center gap-3 px-4 py-2 border-t border-border bg-card">
              <button type="button" class="btn btn-icon btn-secondary" aria-label="上一帧">
                <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/chevron-left.svg);mask-image:url(../assets/icons/google/chevron-left.svg)"></span>
              </button>
              <button type="button" class="btn btn-icon btn-primary" aria-label="播放">
                <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/circle-play.svg);mask-image:url(../assets/icons/google/circle-play.svg)"></span>
              </button>
              <button type="button" class="btn btn-icon btn-secondary" aria-label="下一帧">
                <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/chevron-right.svg);mask-image:url(../assets/icons/google/chevron-right.svg)"></span>
              </button>
              <span class="font-mono text-sm text-foreground" aria-live="polite">00:00:05:12 / 00:00:32:08</span>
              <div class="flex-1"></div>
              <div class="flex items-center gap-2">
                <span data-icon class="w-4 h-4 text-muted-foreground" style="-webkit-mask-image:url(../assets/icons/google/circle-minus.svg);mask-image:url(../assets/icons/google/circle-minus.svg)"></span>
                <input type="range" min="10" max="200" value="100" aria-label="时间轴缩放" class="w-28 h-1.5 accent-primary bg-muted rounded-full appearance-none cursor-pointer">
                <span data-icon class="w-4 h-4 text-muted-foreground" style="-webkit-mask-image:url(../assets/icons/google/circle-plus.svg);mask-image:url(../assets/icons/google/circle-plus.svg)"></span>
              </div>
            </div>
          </div>

          <!-- Properties panel -->
          <aside class="properties-panel" aria-label="属性面板">
            <div class="px-4 py-3 border-b border-border">
              <h2 class="text-sm font-semibold">属性</h2>
              <p class="text-xs text-muted-foreground">当前选中：视频片段 1</p>
            </div>
            <div class="flex-1 overflow-y-auto p-4 space-y-4">
              <section class="rounded-lg border border-border p-3 bg-background">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">变换</h3>
                <div class="grid grid-cols-2 gap-2 mb-2">
                  <label class="text-xs text-muted-foreground">X 位置
                    <input type="number" value="0" class="mt-1 w-full h-8 px-2 rounded border border-input bg-card text-sm">
                  </label>
                  <label class="text-xs text-muted-foreground">Y 位置
                    <input type="number" value="0" class="mt-1 w-full h-8 px-2 rounded border border-input bg-card text-sm">
                  </label>
                </div>
                <label class="text-xs text-muted-foreground">缩放
                  <input type="range" min="50" max="200" value="100" class="w-full mt-2 h-1.5 accent-primary bg-muted rounded-full appearance-none cursor-pointer">
                </label>
              </section>
              <section class="rounded-lg border border-border p-3 bg-background">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">外观</h3>
                <div class="space-y-3">
                  <label class="text-xs text-muted-foreground">不透明度
                    <input type="range" min="0" max="100" value="100" class="w-full mt-2 h-1.5 accent-primary bg-muted rounded-full appearance-none cursor-pointer">
                  </label>
                  <label class="text-xs text-muted-foreground">动态模糊
                    <input type="range" min="0" max="20" value="4" class="w-full mt-2 h-1.5 accent-primary bg-muted rounded-full appearance-none cursor-pointer">
                  </label>
                </div>
              </section>
              <section class="rounded-lg border border-border p-3 bg-background">
                <h3 class="text-xs font-semibold uppercase tracking-wide text-muted-foreground mb-3">效果</h3>
                <div class="flex items-center justify-between py-2 border-b border-border">
                  <span class="text-sm">焦点缩放</span>
                  <button type="button" class="btn btn-sm btn-primary">启用</button>
                </div>
                <div class="flex items-center justify-between py-2">
                  <span class="text-sm">平滑指针</span>
                  <button type="button" class="btn btn-sm btn-secondary">配置</button>
                </div>
              </section>
            </div>
            <div class="p-3 border-t border-border">
              <button type="button" class="btn btn-primary w-full">导出设置</button>
            </div>
          </aside>
        </section>
      </div>

      <!-- Timeline -->
      <section class="editor-timeline" aria-label="多轨道时间轴">
        <div class="flex items-center justify-between px-4 py-2 border-b border-border bg-background">
          <div class="flex items-center gap-2">
            <button type="button" class="btn btn-icon btn-ghost" aria-label="放大时间轴">
              <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/circle-plus.svg);mask-image:url(../assets/icons/google/circle-plus.svg)"></span>
            </button>
            <button type="button" class="btn btn-icon btn-ghost" aria-label="缩小时间轴">
              <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/circle-minus.svg);mask-image:url(../assets/icons/google/circle-minus.svg)"></span>
            </button>
            <span class="font-mono text-xs text-muted-foreground">00:00:00:00</span>
          </div>
          <div class="flex items-center gap-2">
            <button type="button" class="btn btn-ghost btn-sm">
              <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/folder-open.svg);mask-image:url(../assets/icons/google/folder-open.svg)"></span>
              导入
            </button>
            <button type="button" class="btn btn-secondary btn-sm">
              <span data-icon class="w-4 h-4" style="-webkit-mask-image:url(../assets/icons/google/check.svg);mask-image:url(../assets/icons/google/check.svg)"></span>
              完成
            </button>
          </div>
        </div>
        <div class="timeline-scroll">
          <div class="min-w-[900px]">
            <div class="track">
              <div class="track-header">视频</div>
              <div class="track-lane">
                <div class="playhead" aria-hidden="true"></div>
                <button type="button" class="clip clip-video" tabindex="0" aria-label="视频片段 1">Screen recording</button>
              </div>
            </div>
            <div class="track">
              <div class="track-header">光标</div>
              <div class="track-lane">
                <button type="button" class="clip clip-cursor" tabindex="0" aria-label="光标轨迹">Smooth pointer</button>
              </div>
            </div>
            <div class="track">
              <div class="track-header">缩放</div>
              <div class="track-lane">
                <button type="button" class="clip clip-zoom" tabindex="0" aria-label="缩放关键帧">Focus zoom</button>
              </div>
            </div>
            <div class="track">
              <div class="track-header">音频</div>
              <div class="track-lane">
                <button type="button" class="clip clip-audio" tabindex="0" aria-label="音频轨道">Voiceover</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>lucide.createIcons();</script>

    <style id="critical-layout">
      /* Editor shell: full-viewport app frame, no horizontal overflow */
      .editor-shell {
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
        background: var(--background);
        color: var(--foreground);
      }
      .editor-topbar {
        flex: none;
        height: 56px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 0 16px;
        border-bottom: 1px solid var(--border);
        background: var(--card);
      }
      .editor-workspace {
        flex: 1 1 0;
        display: flex;
        min-height: 0;
        overflow: hidden;
      }
      .editor-rail {
        flex: none;
        width: 64px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        padding: 10px 0;
        border-right: 1px solid var(--sidebar-border);
        background: var(--sidebar);
        color: var(--sidebar-foreground);
        overflow-y: auto;
      }
      .editor-stage {
        flex: 1 1 0;
        display: flex;
        min-width: 0;
      }
      .canvas-wrap {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        position: relative;
      }
      .canvas {
        flex: 1 1 0;
        min-height: 0;
        display: grid;
        place-items: center;
        background: var(--muted);
        overflow: hidden;
      }
      .properties-panel {
        flex: none;
        width: 260px;
        display: flex;
        flex-direction: column;
        border-left: 1px solid var(--border);
        background: var(--card);
        overflow-y: auto;
      }
      .editor-timeline {
        flex: none;
        height: 220px;
        display: flex;
        flex-direction: column;
        border-top: 1px solid var(--border);
        background: var(--card);
        overflow: hidden;
      }
      .timeline-scroll {
        flex: 1 1 0;
        min-height: 0;
        overflow: auto;
      }
      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 36px;
        padding: 0 14px;
        border: 1px solid transparent;
        border-radius: var(--radius);
        font: 500 13px/1 var(--font-sans);
        white-space: nowrap;
        cursor: pointer;
        transition: background-color .15s, border-color .15s, color .15s;
      }
      .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
      .btn:active { transform: translateY(1px); }
      .btn:disabled { background: var(--muted); color: var(--muted-foreground); border-color: transparent; cursor: not-allowed; transform: none; }
      .btn-primary { background: var(--primary); color: var(--primary-foreground); }
      .btn-primary:hover { filter: brightness(.96); }
      .btn-secondary { background: var(--secondary); color: var(--secondary-foreground); border-color: var(--border); }
      .btn-secondary:hover { background: var(--accent); color: var(--accent-foreground); }
      .btn-ghost { background: transparent; color: var(--foreground); border-color: var(--border); }
      .btn-ghost:hover { background: var(--accent); color: var(--accent-foreground); }
      .btn-sm { height: 32px; padding: 0 12px; }
      .btn-icon { width: 34px; height: 34px; padding: 0; }
      /* Rail items */
      .rail-item {
        width: 44px;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: var(--radius);
        color: inherit;
        background: transparent;
        border: 1px solid transparent;
        cursor: pointer;
      }
      .rail-item:hover { background: var(--sidebar-accent); color: var(--sidebar-accent-foreground); }
      .rail-item.active { background: var(--sidebar-primary); color: var(--sidebar-primary-foreground); }
      .rail-item:focus-visible { outline: 2px solid var(--sidebar-ring); outline-offset: 2px; }
      /* Track layout */
      .track {
        display: grid;
        grid-template-columns: 96px 1fr;
        align-items: center;
        min-height: 44px;
        border-bottom: 1px solid var(--border);
      }
      .track-header {
        padding: 0 12px;
        font: 600 11px/1 var(--font-sans);
        color: var(--muted-foreground);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .track-lane {
        position: relative;
        height: 100%;
        min-height: 44px;
        background: repeating-linear-gradient(90deg, var(--border) 0, var(--border) 1px, transparent 1px, transparent 64px);
      }
      .clip {
        position: absolute;
        top: 6px;
        bottom: 6px;
        border-radius: var(--radius);
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        padding: 0 10px;
        font: 500 12px/1 var(--font-sans);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        cursor: pointer;
      }
      .clip:focus-visible { outline: 2px solid var(--ring); outline-offset: -2px; }
      .clip-video { left: 0; width: 420px; background: var(--primary); color: var(--primary-foreground); }
      .clip-cursor { left: 128px; width: 180px; background: var(--chart-3); color: var(--foreground); }
      .clip-zoom { left: 64px; width: 260px; background: var(--chart-5); color: var(--foreground); }
      .clip-audio { left: 0; width: 380px; background: var(--secondary); color: var(--secondary-foreground); }
      .playhead {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 200px;
        width: 2px;
        background: var(--destructive);
        z-index: 10;
        pointer-events: none;
      }
      .playhead::before {
        content: '';
        position: absolute;
        top: -5px;
        left: -5px;
        width: 12px;
        height: 12px;
        border-radius: 999px;
        background: var(--destructive);
      }
    </style>
</body>
</html>

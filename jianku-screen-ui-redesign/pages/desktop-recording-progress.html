    <style id="theme-vars">
/* Source: structured-spec */
/* Brand profile: google / dashboard / clean / analytical / modern */
/* Theme mode: light-dark */
/* Alias layer: enabled */

/* Light mode source tokens */
:root {
  /* Core surface colors */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* Semantic action colors */
  --primary: #4285f4;
  --primary-foreground: #ffffff;
  --secondary: #dbeafe;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #dbeafe;
  --accent-foreground: #003e8f;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #ebebeb;
  --input: #e2e3e4;
  --ring: #4285f4;

  /* Data visualization */
  --chart-1: #4285f4;
  --chart-2: #ea4335;
  --chart-3: #fbbc05;
  --chart-4: #0043ad;
  --chart-5: #34a853;

  /* Sidebar */
  --sidebar: #f0f6ff;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #4285f4;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #dbeafe;
  --sidebar-accent-foreground: #003e8f;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #4285f4;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #0e1115;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-sm: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow-md: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 2px 4px -1px rgba(14, 17, 21, 0);
  --shadow-lg: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 4px 6px -1px rgba(14, 17, 21, 0);
  --shadow-xl: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 8px 10px -1px rgba(14, 17, 21, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(14, 17, 21, 0);

  /* Rhythm */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
  /* Patched radius aliases for head-contract compatibility */
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);

}

/* Dark mode source tokens */
.dark {
  /* Core surface colors */
  --background: #161616;
  --foreground: #eff1f4;
  --card: #1d1d1c;
  --card-foreground: #eff1f4;
  --popover: #2e2e2e;
  --popover-foreground: #e5e5e5;

  /* Semantic action colors */
  --primary: #fc2c50;
  --primary-foreground: #ffffff;
  --secondary: #383838;
  --secondary-foreground: #e5e5e5;
  --muted: #383838;
  --muted-foreground: #949494;
  --accent: #4a2026;
  --accent-foreground: #fc2c50;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #1d1d1c;
  --input: #000000;
  --ring: #ffffff;

  /* Data visualization */
  --chart-1: #2dccd3;
  --chart-2: #f1204a;
  --chart-3: #edbbe8;
  --chart-4: #fbeb35;
  --chart-5: #baf6f0;

  /* Sidebar */
  --sidebar: #171717;
  --sidebar-foreground: #e5e5e5;
  --sidebar-primary: #0065fd;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #00266b;
  --sidebar-accent-foreground: #bfdbfe;
  --sidebar-border: #404040;
  --sidebar-ring: #00266b;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(0, 0, 0, 0);
}

/* Alias layer */
@theme inline {
  /* Color aliases */
  --google-color-background: var(--background);
  --google-color-foreground: var(--foreground);
  --google-color-card: var(--card);
  --google-color-card-foreground: var(--card-foreground);
  --google-color-popover: var(--popover);
  --google-color-popover-foreground: var(--popover-foreground);
  --google-color-primary: var(--primary);
  --google-color-primary-foreground: var(--primary-foreground);
  --google-color-secondary: var(--secondary);
  --google-color-secondary-foreground: var(--secondary-foreground);
  --google-color-muted: var(--muted);
  --google-color-muted-foreground: var(--muted-foreground);
  --google-color-accent: var(--accent);
  --google-color-accent-foreground: var(--accent-foreground);
  --google-color-destructive: var(--destructive);
  --google-color-destructive-foreground: var(--destructive-foreground);
  --google-color-border: var(--border);
  --google-color-input: var(--input);
  --google-color-ring: var(--ring);
  --google-color-chart-1: var(--chart-1);
  --google-color-chart-2: var(--chart-2);
  --google-color-chart-3: var(--chart-3);
  --google-color-chart-4: var(--chart-4);
  --google-color-chart-5: var(--chart-5);
  --google-color-sidebar: var(--sidebar);
  --google-color-sidebar-foreground: var(--sidebar-foreground);
  --google-color-sidebar-primary: var(--sidebar-primary);
  --google-color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --google-color-sidebar-accent: var(--sidebar-accent);
  --google-color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --google-color-sidebar-border: var(--sidebar-border);
  --google-color-sidebar-ring: var(--sidebar-ring);

  /* Typography aliases */
  --google-font-sans: var(--font-sans);
  --google-font-serif: var(--font-serif);
  --google-font-mono: var(--font-mono);

  /* Radius aliases */
  --google-radius: var(--radius);
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);
  --google-radius-xl: calc(var(--radius) + 4px);

  /* Shadow aliases */
  --google-shadow-x: var(--shadow-x);
  --google-shadow-y: var(--shadow-y);
  --google-shadow-blur: var(--shadow-blur);
  --google-shadow-spread: var(--shadow-spread);
  --google-shadow-opacity: var(--shadow-opacity);
  --google-shadow-color: var(--shadow-color);
  --google-shadow-2xs: var(--shadow-2xs);
  --google-shadow-xs: var(--shadow-xs);
  --google-shadow-sm: var(--shadow-sm);
  --google-shadow: var(--shadow);
  --google-shadow-md: var(--shadow-md);
  --google-shadow-lg: var(--shadow-lg);
  --google-shadow-xl: var(--shadow-xl);
  --google-shadow-2xl: var(--shadow-2xl);

  /* Rhythm aliases */
  --google-tracking-normal: var(--tracking-normal);
  --google-spacing: var(--spacing);
}

<body class="min-h-screen font-sans antialiased">
    <main>
      <style id="critical-layout">
        .recording-stage {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: repeating-conic-gradient(var(--border) 0% 25%, transparent 0% 50%) 50% / 20px 20px;
        }
        .recording-bar {
          position: fixed;
          left: 50%;
          bottom: 32px;
          transform: translateX(-50%);
          display: flex;
          align-items: center;
          gap: calc(var(--spacing) * 2);
          width: max-content;
          max-width: calc(100vw - 64px);
          padding: calc(var(--spacing) * 2) calc(var(--spacing) * 3);
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: rgba(255, 255, 255, 0.96);
          backdrop-filter: blur(8px);
          -webkit-backdrop-filter: blur(8px);
          box-shadow: none;
        }
        .recording-bar__group {
          display: flex;
          align-items: center;
          gap: calc(var(--spacing) * 2);
          flex-shrink: 0;
        }
        .recording-bar__divider {
          width: 1px;
          height: 24px;
          background: var(--border);
          flex-shrink: 0;
        }
        .recording-dot {
          width: 10px;
          height: 10px;
          border-radius: 9999px;
          background: var(--destructive);
          animation: recording-pulse 1.6s ease-in-out infinite;
        }
        @keyframes recording-pulse {
          0%, 100% { opacity: 1; transform: scale(1); }
          50% { opacity: 0.55; transform: scale(0.92); }
        }
        .recording-timer {
          font-family: var(--font-mono);
          font-size: 1.5rem;
          font-weight: 500;
          line-height: 1;
          letter-spacing: -0.02em;
          color: var(--foreground);
          min-width: 5.5ch;
          text-align: center;
          tabular-nums: 1;
        }
        .source-pill {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 10px;
          border: 1px solid var(--border);
          border-radius: var(--radius);
          background: var(--popover);
          color: var(--popover-foreground);
          font-size: 12px;
          font-weight: 500;
          line-height: 1;
          white-space: nowrap;
        }
        .shortcut-hint {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          padding: 4px 8px;
          border-radius: calc(var(--radius) - 4px);
          background: var(--muted);
          color: var(--muted-foreground);
          font-family: var(--font-mono);
          font-size: 11px;
          line-height: 1;
          white-space: nowrap;
        }
        .rec-btn {
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 6px;
          height: 36px;
          padding: 0 14px;
          border: 1px solid transparent;
          border-radius: var(--radius);
          background: transparent;
          color: var(--foreground);
          font: 500 13px/1 var(--font-sans);
          white-space: nowrap;
          cursor: pointer;
          transition: background-color .15s, border-color .15s, color .15s;
        }
        .rec-btn:focus-visible {
          outline: 2px solid var(--ring);
          outline-offset: 2px;
        }
        .rec-btn:active {
          transform: translateY(1px);
        }
        .rec-btn--primary {
          background: var(--primary);
          color: var(--primary-foreground);
        }
        .rec-btn--primary:hover {
          filter: brightness(0.96);
        }
        .rec-btn--secondary {
          background: var(--secondary);
          color: var(--secondary-foreground);
        }
        .rec-btn--secondary:hover {
          background: var(--accent);
          color: var(--accent-foreground);
        }
        .rec-btn--destructive {
          background: var(--destructive);
          color: var(--destructive-foreground);
        }
        .rec-btn--destructive:hover {
          filter: brightness(0.96);
        }
        .rec-btn--ghost {
          border-color: var(--border);
          background: var(--popover);
          color: var(--popover-foreground);
        }
        .rec-btn--ghost:hover {
          background: var(--accent);
          color: var(--accent-foreground);
        }
        .rec-btn--icon {
          width: 36px;
          padding: 0;
        }
        .rec-icon {
          display: inline-flex;
          width: 16px;
          height: 16px;
          -webkit-mask-size: contain;
          mask-size: contain;
          -webkit-mask-repeat: no-repeat;
          mask-repeat: no-repeat;
          -webkit-mask-position: center;
          mask-position: center;
          background-color: currentColor;
        }
        @media (max-width: 720px) {
          .recording-bar {
            bottom: 16px;
            max-width: calc(100vw - 32px);
            padding: calc(var(--spacing) * 1.5) calc(var(--spacing) * 2);
          }
          .recording-bar__group--optional {
            display: none;
          }
          .recording-timer {
            font-size: 1.25rem;
          }
        }
      </style>

      <section class="recording-stage" aria-label="录制预览画布">
        <div class="bg-card border border-border rounded-lg px-8 py-6 text-center shadow-none">
          <p class="text-muted-foreground text-sm mb-2">正在录制屏幕</p>
          <p class="text-foreground text-base font-medium">Jianku Screen Next</p>
        </div>
      </section>

      <nav class="recording-bar" role="toolbar" aria-label="录制控制栏">
        <div class="recording-bar__group">
          <span class="recording-dot" aria-hidden="true"></span>
          <time class="recording-timer" datetime="PT0S" aria-live="polite" id="rec-timer">00:00:00</time>
        </div>

        <div class="recording-bar__divider" aria-hidden="true"></div>

        <div class="recording-bar__group">
          <button type="button" class="rec-btn rec-btn--secondary rec-btn--icon" aria-label="暂停录制" title="暂停 (Space)">
            <span class="rec-icon" style="-webkit-mask-image: url(../assets/icons/google/circle-pause.svg); mask-image: url(../assets/icons/google/circle-pause.svg);" aria-hidden="true"></span>
          </button>
          <button type="button" class="rec-btn rec-btn--primary" aria-label="继续录制" title="继续 (Space)">
            <span class="rec-icon" style="-webkit-mask-image: url(../assets/icons/google/circle-play.svg); mask-image: url(../assets/icons/google/circle-play.svg);" aria-hidden="true"></span>
            <span>继续</span>
          </button>
          <button type="button" class="rec-btn rec-btn--destructive" aria-label="停止并保存录制" title="停止 (Ctrl + S)">
            <span class="rec-icon" style="-webkit-mask-image: url(../assets/icons/google/circle-minus.svg); mask-image: url(../assets/icons/google/circle-minus.svg);" aria-hidden="true"></span>
            <span>停止</span>
          </button>
        </div>

        <div class="recording-bar__divider recording-bar__group--optional" aria-hidden="true"></div>

        <div class="recording-bar__group recording-bar__group--optional">
          <span class="source-pill">
            <span class="rec-icon" style="-webkit-mask-image: url(../assets/icons/google/mouse-pointer-click.svg); mask-image: url(../assets/icons/google/mouse-pointer-click.svg); width: 12px; height: 12px;" aria-hidden="true"></span>
            平滑指针
          </span>
          <span class="source-pill">焦点缩放</span>
          <span class="source-pill">动态模糊</span>
        </div>

        <div class="recording-bar__divider recording-bar__group--optional" aria-hidden="true"></div>

        <div class="recording-bar__group recording-bar__group--optional">
          <span class="shortcut-hint">Space 暂停</span>
          <span class="shortcut-hint">Ctrl+S 停止</span>
        </div>
      </nav>
    </main>
    <script>lucide.createIcons();</script>
</body>
</html>

/* Source: structured-spec */
/* Brand profile: google / dashboard / clean / analytical / modern */
/* Theme mode: light-dark */
/* Alias layer: enabled */

/* Light mode source tokens */
:root {
  /* Core surface colors */
  --background: #ffffff;
  --foreground: #0e1115;
  --card: #ffffff;
  --card-foreground: #0e1115;
  --popover: #f9f9fa;
  --popover-foreground: #0e1115;

  /* Semantic action colors */
  --primary: #4285f4;
  --primary-foreground: #ffffff;
  --secondary: #dbeafe;
  --secondary-foreground: #333942;
  --muted: #eff1f4;
  --muted-foreground: #7f8d9f;
  --accent: #dbeafe;
  --accent-foreground: #003e8f;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #ebebeb;
  --input: #e2e3e4;
  --ring: #4285f4;

  /* Data visualization */
  --chart-1: #4285f4;
  --chart-2: #ea4335;
  --chart-3: #fbbc05;
  --chart-4: #0043ad;
  --chart-5: #34a853;

  /* Sidebar */
  --sidebar: #f0f6ff;
  --sidebar-foreground: #0e1115;
  --sidebar-primary: #4285f4;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #dbeafe;
  --sidebar-accent-foreground: #003e8f;
  --sidebar-border: #e7eaef;
  --sidebar-ring: #4285f4;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #0e1115;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-xs: 0 3px 0px 0px rgba(14, 17, 21, 0);
  --shadow-sm: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 1px 2px -1px rgba(14, 17, 21, 0);
  --shadow-md: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 2px 4px -1px rgba(14, 17, 21, 0);
  --shadow-lg: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 4px 6px -1px rgba(14, 17, 21, 0);
  --shadow-xl: 0 3px 0px 0px rgba(14, 17, 21, 0), 0 8px 10px -1px rgba(14, 17, 21, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(14, 17, 21, 0);

  /* Rhythm */
  --tracking-normal: 0em;
  --spacing: 0.24rem;
  /* Patched radius aliases for head-contract compatibility */
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);

}

/* Dark mode source tokens */
.dark {
  /* Core surface colors */
  --background: #161616;
  --foreground: #eff1f4;
  --card: #1d1d1c;
  --card-foreground: #eff1f4;
  --popover: #2e2e2e;
  --popover-foreground: #e5e5e5;

  /* Semantic action colors */
  --primary: #fc2c50;
  --primary-foreground: #ffffff;
  --secondary: #383838;
  --secondary-foreground: #e5e5e5;
  --muted: #383838;
  --muted-foreground: #949494;
  --accent: #4a2026;
  --accent-foreground: #fc2c50;
  --destructive: #ef4444;
  --destructive-foreground: #ffffff;

  /* Borders, inputs, focus */
  --border: #1d1d1c;
  --input: #000000;
  --ring: #ffffff;

  /* Data visualization */
  --chart-1: #2dccd3;
  --chart-2: #f1204a;
  --chart-3: #edbbe8;
  --chart-4: #fbeb35;
  --chart-5: #baf6f0;

  /* Sidebar */
  --sidebar: #171717;
  --sidebar-foreground: #e5e5e5;
  --sidebar-primary: #0065fd;
  --sidebar-primary-foreground: #ffffff;
  --sidebar-accent: #00266b;
  --sidebar-accent-foreground: #bfdbfe;
  --sidebar-border: #404040;
  --sidebar-ring: #00266b;

  /* Typography */
  --font-sans: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-serif: DM Sans, ui-sans-serif, sans-serif, system-ui;
  --font-mono: JetBrains Mono, monospace;

  /* Radius */
  --radius: 0.5rem;

  /* Shadow primitives */
  --shadow-x: 0;
  --shadow-y: 3px;
  --shadow-blur: 0px;
  --shadow-spread: 0px;
  --shadow-opacity: 0;
  --shadow-color: #000000;

  /* Elevation */
  --shadow-2xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-xs: 0 3px 0px 0px rgba(0, 0, 0, 0);
  --shadow-sm: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 1px 2px -1px rgba(0, 0, 0, 0);
  --shadow-md: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 2px 4px -1px rgba(0, 0, 0, 0);
  --shadow-lg: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 4px 6px -1px rgba(0, 0, 0, 0);
  --shadow-xl: 0 3px 0px 0px rgba(0, 0, 0, 0), 0 8px 10px -1px rgba(0, 0, 0, 0);
  --shadow-2xl: 0 3px 0px 0px rgba(0, 0, 0, 0);
}

/* Alias layer */
@theme inline {
  /* Color aliases */
  --google-color-background: var(--background);
  --google-color-foreground: var(--foreground);
  --google-color-card: var(--card);
  --google-color-card-foreground: var(--card-foreground);
  --google-color-popover: var(--popover);
  --google-color-popover-foreground: var(--popover-foreground);
  --google-color-primary: var(--primary);
  --google-color-primary-foreground: var(--primary-foreground);
  --google-color-secondary: var(--secondary);
  --google-color-secondary-foreground: var(--secondary-foreground);
  --google-color-muted: var(--muted);
  --google-color-muted-foreground: var(--muted-foreground);
  --google-color-accent: var(--accent);
  --google-color-accent-foreground: var(--accent-foreground);
  --google-color-destructive: var(--destructive);
  --google-color-destructive-foreground: var(--destructive-foreground);
  --google-color-border: var(--border);
  --google-color-input: var(--input);
  --google-color-ring: var(--ring);
  --google-color-chart-1: var(--chart-1);
  --google-color-chart-2: var(--chart-2);
  --google-color-chart-3: var(--chart-3);
  --google-color-chart-4: var(--chart-4);
  --google-color-chart-5: var(--chart-5);
  --google-color-sidebar: var(--sidebar);
  --google-color-sidebar-foreground: var(--sidebar-foreground);
  --google-color-sidebar-primary: var(--sidebar-primary);
  --google-color-sidebar-primary-foreground: var(--sidebar-primary-foreground);
  --google-color-sidebar-accent: var(--sidebar-accent);
  --google-color-sidebar-accent-foreground: var(--sidebar-accent-foreground);
  --google-color-sidebar-border: var(--sidebar-border);
  --google-color-sidebar-ring: var(--sidebar-ring);

  /* Typography aliases */
  --google-font-sans: var(--font-sans);
  --google-font-serif: var(--font-serif);
  --google-font-mono: var(--font-mono);

  /* Radius aliases */
  --google-radius: var(--radius);
  --google-radius-sm: calc(var(--radius) - 4px);
  --google-radius-md: calc(var(--radius) - 2px);
  --google-radius-lg: var(--radius);
  --google-radius-xl: calc(var(--radius) + 4px);

  /* Shadow aliases */
  --google-shadow-x: var(--shadow-x);
  --google-shadow-y: var(--shadow-y);
  --google-shadow-blur: var(--shadow-blur);
  --google-shadow-spread: var(--shadow-spread);
  --google-shadow-opacity: var(--shadow-opacity);
  --google-shadow-color: var(--shadow-color);
  --google-shadow-2xs: var(--shadow-2xs);
  --google-shadow-xs: var(--shadow-xs);
  --google-shadow-sm: var(--shadow-sm);
  --google-shadow: var(--shadow);
  --google-shadow-md: var(--shadow-md);
  --google-shadow-lg: var(--shadow-lg);
  --google-shadow-xl: var(--shadow-xl);
  --google-shadow-2xl: var(--shadow-2xl);

  /* Rhythm aliases */
  --google-tracking-normal: var(--tracking-normal);
  --google-spacing: var(--spacing);
}

<body class="min-h-screen font-sans antialiased">
    <main>
        <div class="mobile-recorder">
            <!-- Preview Stage -->
            <div class="preview-stage">
                <div class="preview-placeholder">
                    <div class="preview-grid" aria-hidden="true"></div>
                    <span class="relative text-white/60 text-sm font-medium font-sans">Camera / Screen Preview</span>
                </div>

                <!-- Top Toolbar -->
                <div class="top-toolbar">
                    <button type="button" class="top-btn inline-flex items-center justify-center w-10 h-10 rounded-lg border border-white/20 bg-black/40 text-white backdrop-blur-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="返回">
                        <i data-icon class="icon-chevron-left" aria-hidden="true"></i>
                    </button>

                    <div class="mode-switcher" role="tablist" aria-label="录制模式">
                        <button type="button" class="mode-btn active" role="tab" aria-selected="true" aria-controls="screen-preview" id="tab-screen">屏幕</button>
                        <button type="button" class="mode-btn" role="tab" aria-selected="false" aria-controls="camera-preview" id="tab-camera">相机</button>
                    </div>

                    <button type="button" class="top-btn inline-flex items-center justify-center w-10 h-10 rounded-lg border border-white/20 bg-black/40 text-white backdrop-blur-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="设置">
                        <span class="text-xs font-medium">设置</span>
                    </button>
                </div>

                <!-- Timer Pill -->
                <div class="timer-pill" aria-live="polite" aria-atomic="true">
                    <span class="timer-dot" aria-hidden="true"></span>
                    <span class="timer-text">00:00</span>
                </div>
            </div>

            <!-- Bottom Controls -->
            <div class="bottom-controls">
                <button type="button" class="control-btn flex flex-col items-center justify-center gap-1.5 min-w-[64px] px-3 py-2.5 rounded-lg border border-border bg-card text-foreground text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="静音" aria-pressed="false">
                    <span>静音</span>
                </button>

                <button type="button" class="record-btn" aria-label="开始录制">
                    <span class="record-inner" aria-hidden="true"></span>
                </button>

                <button type="button" class="control-btn flex flex-col items-center justify-center gap-1.5 min-w-[64px] px-3 py-2.5 rounded-lg border border-border bg-card text-foreground text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="标注">
                    <i data-icon class="icon-pen-line" aria-hidden="true"></i>
                    <span>标注</span>
                </button>
            </div>

            <!-- Camera Switch -->
            <div class="camera-switch-row">
                <button type="button" class="switch-btn inline-flex items-center gap-1.5 px-3.5 py-2 rounded-lg border border-border bg-card text-foreground text-xs font-medium focus:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="切换摄像头">
                    <span>切换摄像头</span>
                </button>
            </div>
        </div>
    </main>
    <script>lucide.createIcons();</script>

    <style id="critical-layout">
      :root {
        --recorder-frame-max-width: 430px;
        --recorder-topbar-height: 56px;
      }
      .mobile-recorder {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 100%;
        max-width: var(--recorder-frame-max-width);
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        background: var(--background);
        overflow: hidden;
      }
      .preview-stage {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .preview-placeholder {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--foreground);
      }
      .preview-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px);
        background-size: 32px 32px;
      }
      .top-toolbar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: max(env(safe-area-inset-top), 12px) 12px 12px;
        min-height: var(--recorder-topbar-height);
      }
      .mode-switcher {
        display: inline-flex;
        align-items: center;
        border-radius: var(--radius);
        background: rgba(14, 17, 21, 0.55);
        padding: 4px;
        backdrop-filter: blur(6px);
      }
      .mode-btn {
        flex: 1 1 auto;
        padding: 8px 16px;
        border-radius: calc(var(--radius) - 4px);
        border: none;
        background: transparent;
        color: rgba(255, 255, 255, 0.85);
        font: 500 13px/1 var(--font-sans);
        cursor: pointer;
      }
      .mode-btn.active {
        background: var(--primary);
        color: var(--primary-foreground);
      }
      .timer-pill {
        position: absolute;
        top: calc(max(env(safe-area-inset-top), 12px) + var(--recorder-topbar-height) + 12px);
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 14px;
        border-radius: 999px;
        background: rgba(14, 17, 21, 0.55);
        color: #ffffff;
        font: 600 15px/1 var(--font-mono);
        backdrop-filter: blur(6px);
      }
      .timer-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--destructive);
        animation: pulse-dot 1.4s ease-in-out infinite;
      }
      @keyframes pulse-dot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .bottom-controls {
        position: relative;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-around;
        gap: 16px;
        padding: 16px 24px calc(16px + env(safe-area-inset-bottom));
        background: var(--background);
        border-top: 1px solid var(--border);
      }
      .record-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 72px;
        height: 72px;
        border-radius: 50%;
        border: 4px solid var(--border);
        background: var(--destructive);
        color: var(--destructive-foreground);
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .record-btn:active {
        transform: scale(0.95);
      }
      .record-inner {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        background: var(--destructive-foreground);
      }
      .camera-switch-row {
        display: flex;
        justify-content: center;
        padding: 0 24px calc(12px + env(safe-area-inset-bottom));
        background: var(--background);
      }
      .icon-chevron-left {
        width: 20px;
        height: 20px;
        -webkit-mask-image: url('../assets/icons/google/chevron-left.svg');
        mask-image: url('../assets/icons/google/chevron-left.svg');
      }
      .icon-pen-line {
        width: 20px;
        height: 20px;
        -webkit-mask-image: url('../assets/icons/google/pen-line.svg');
        mask-image: url('../assets/icons/google/pen-line.svg');
      }
      @media (max-width: 480px) {
        .mobile-recorder {
          max-width: 100%;
        }
      }
    </style>
</body>
</html>
